<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Firebase - Offerte e Chat</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .hidden { display: none; }
        .section { border: 1px solid #ccc; padding: 15px; margin-top: 15px; border-radius: 5px; }
        button { cursor: pointer; padding: 8px 12px; }
    </style>
</head>
<body>

    <h2>Gestione Firebase: Chat e Offerte</h2>

    <!-- Sezione UI -->
    <div class="section">
        <button id="btnLogin">Accedi (Simula Login)</button>
        <button id="btnLogout" class="hidden">Esci (Logout)</button>
    </div>

    <div id="app-section" class="section hidden">
        <h3>Pubblica un'offerta</h3>
        <input type="text" id="offerText" placeholder="Scrivi la tua offerta...">
        <button id="btnPublish">Pubblica Offerta</button>
        <p><small><i>Apri la console (F12) per vedere il corretto funzionamento dei Listener e degli aggiornamenti in tempo reale.</i></small></p>
    </div>

    <!-- Modulo Firebase -->
    <script type="module">
        // 1. IMPORTAZIONE SDK FIREBASE
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 2. CONFIGURAZIONE FIREBASE (INSERISCI I TUOI DATI QUI)
        const firebaseConfig = {
            apiKey: "INSERISCI_LA_TUA_API_KEY",
            authDomain: "INSERISCI_IL_TUO_AUTH_DOMAIN",
            projectId: "INSERISCI_IL_TUO_PROJECT_ID",
            storageBucket: "INSERISCI_IL_TUO_STORAGE_BUCKET",
            messagingSenderId: "INSERISCI_IL_TUO_MESSAGING_SENDER_ID",
            appId: "INSERISCI_IL_TUO_APP_ID"
        };

        // Inizializzazione servizi
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 3. VARIABILI GLOBALI PER I LISTENER
        let unsubscribeChat = null;
        let unsubscribeOffers = null;

        // Elementi DOM
        const btnLogin = document.getElementById('btnLogin');
        const btnLogout = document.getElementById('btnLogout');
        const btnPublish = document.getElementById('btnPublish');
        const appSection = document.getElementById('app-section');

        // 4. FUNZIONI DI GESTIONE LISTENER
        function startListeners() {
            console.log("Avvio dei listener per chat e offerte...");
            
            // Listener Offerte
            unsubscribeOffers = onSnapshot(collection(db, "offers"), (snapshot) => {
                console.log("Dati OFFRETE letti/aggiornati correttamente!");
            }, (error) => {
                console.error("Errore listener offerte:", error);
            });

            // Listener Chat
            unsubscribeChat = onSnapshot(collection(db, "chats"), (snapshot) => {
                console.log("Dati CHAT letti/aggiornati correttamente!");
            }, (error) => {
                console.error("Errore listener chat:", error);
            });
        }

        function stopListeners() {
            // Esegue l'unsubscribe e svuota le variabili
            if (unsubscribeOffers) {
                unsubscribeOffers();
                unsubscribeOffers = null;
                console.log("Listener offerte fermato.");
            }
            if (unsubscribeChat) {
                unsubscribeChat();
                unsubscribeChat = null;
                console.log("Listener chat fermato.");
            }
        }

        // 5. OSSERVATORE STATO AUTENTICAZIONE
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Utente Loggato
                btnLogin.classList.add('hidden');
                btnLogout.classList.remove('hidden');
                appSection.classList.remove('hidden');
                
                // Avvia i listener SOLO quando siamo sicuri che l'utente è loggato
                startListeners();
            } else {
                // Utente Disconnesso
                btnLogin.classList.remove('hidden');
                btnLogout.classList.add('hidden');
                appSection.classList.add('hidden');
            }
        });

        // 6. GESTIONE LOGOUT
        btnLogout.addEventListener('click', async () => {
            try {
                // FONDAMENTALE: Ferma i listener PRIMA di eseguire il signOut 
                // per evitare l'errore "Missing or insufficient permissions"
                stopListeners();
                
                await signOut(auth);
                console.log("Logout effettuato con successo.");
            } catch (error) {
                console.error("Errore durante il logout:", error);
            }
        });

        // Simula il login (accesso anonimo per facilità di test)
        btnLogin.addEventListener('click', async () => {
            try {
                await signInAnonymously(auth);
            } catch (error) {
                console.error("Errore di login:", error);
            }
        });

        // 7. GESTIONE PUBBLICAZIONE OFFERTE
        btnPublish.addEventListener('click', async () => {
            const offerText = document.getElementById('offerText').value;
            const user = auth.currentUser;

            // CONTROLLO FONDAMENTALE: Verifica presenza utente prima di scrivere sul DB
            if (!user) {
                console.error("Devi effettuare l'accesso per pubblicare un'offerta.");
                alert("Devi effettuare l'accesso per pubblicare un'offerta.");
                return; // Interrompe l'esecuzione della funzione
            }

            if (!offerText.trim()) return;

            try {
                await addDoc(collection(db, "offers"), {
                    text: offerText,
                    userId: user.uid,
                    timestamp: new Date()
                });
                console.log("Offerta pubblicata con successo!");
                document.getElementById('offerText').value = ''; // Svuota input
            } catch (error) {
                console.error("Errore durante la pubblicazione dell'offerta:", error);
            }
        });
    </script>
</body>
</html>
