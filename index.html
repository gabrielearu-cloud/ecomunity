<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMunity - Banca del Tempo</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header & Auth Panel -->
        <header class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-emerald-600">EcoMunity</h1>
                <p class="text-sm text-slate-500">Piattaforma Banca del Tempo</p>
            </div>
            <div>
                <span id="userBadge" class="hidden text-xs bg-emerald-100 text-emerald-800 font-semibold px-2.5 py-1 rounded-full mr-2">
                    Connesso
                </span>
                <button id="btnLogin" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2 rounded-lg transition-colors shadow-sm">
                    Accedi (Anonimo)
                </button>
                <button id="btnLogout" class="hidden bg-rose-600 hover:bg-rose-700 text-white font-medium px-4 py-2 rounded-lg transition-colors shadow-sm">
                    Esci (Logout)
                </button>
            </div>
        </header>

        <!-- Stato Disconnesso -->
        <div id="loggedOutView" class="bg-white p-12 rounded-xl shadow-sm border border-slate-200 text-center">
            <h2 class="text-xl font-semibold text-slate-700 mb-2">Benvenuto in EcoMunity</h2>
            <p class="text-slate-500 max-w-md mx-auto mb-6">Effettua l'accesso per consultare le offerte della banca del tempo e scambiare messaggi con la community.</p>
        </div>

        <!-- Sezione Principale (Visibile solo se loggati) -->
        <main id="appSection" class="hidden grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Colonna 1: Offerte -->
            <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <span>🌱</span> Offerte di Tempo
                </h2>
                
                <!-- Form Nuova Offerta -->
                <div class="flex gap-2 mb-4">
                    <input type="text" id="offerText" placeholder="Es. Offro 1 ora di ripetizioni di inglese..." 
                           class="flex-1 px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                    <button id="btnPublish" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-medium text-sm transition-colors">
                        Pubblica
                    </button>
                </div>

                <!-- Lista Offerte -->
                <div id="offersContainer" class="flex-1 overflow-y-auto max-h-[350px] space-y-3 pr-1">
                    <p class="text-sm text-slate-400 italic">Caricamento offerte...</p>
                </div>
            </section>

            <!-- Colonna 2: Chat Community -->
            <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <span>💬</span> Chat Community
                </h2>

                <!-- Lista Messaggi Chat -->
                <div id="chatContainer" class="flex-1 overflow-y-auto max-h-[300px] min-h-[200px] space-y-3 mb-4 pr-1">
                    <p class="text-sm text-slate-400 italic">Caricamento messaggi...</p>
                </div>

                <!-- Form Invio Messaggio -->
                <div class="flex gap-2">
                    <input type="text" id="chatMessage" placeholder="Scrivi un messaggio..." 
                           class="flex-1 px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                    <button id="btnSendChat" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg font-medium text-sm transition-colors">
                        Invia
                    </button>
                </div>
            </section>

        </main>
    </div>

    <!-- Modulo Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // CONFIGURAZIONE INTEGRATA
        const firebaseConfig = {
            apiKey: "AIzaSyCtqfHmngdEi9JLukTtzt8qVzFF4C-Kh1E",
            authDomain: "ecomunity-3a284.firebaseapp.com",
            projectId: "ecomunity-3a284",
            storageBucket: "ecomunity-3a284.firebasestorage.app",
            messagingSenderId: "438649112413",
            appId: "1:438649112413:web:ed847b70da7e2c72468ab4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // VARIABILI GLOBALI PER UNLISTEN
        let unsubscribeOffers = null;
        let unsubscribeChat = null;

        // ELEMENTI DOM
        const btnLogin = document.getElementById('btnLogin');
        const btnLogout = document.getElementById('btnLogout');
        const userBadge = document.getElementById('userBadge');
        const loggedOutView = document.getElementById('loggedOutView');
        const appSection = document.getElementById('appSection');

        const offerInput = document.getElementById('offerText');
        const btnPublish = document.getElementById('btnPublish');
        const offersContainer = document.getElementById('offersContainer');

        const chatInput = document.getElementById('chatMessage');
        const btnSendChat = document.getElementById('btnSendChat');
        const chatContainer = document.getElementById('chatContainer');

        // GESTIONE LISTENER TEMPO REALE
        function startListeners() {
            // Listener Offerte (Ordinate per data più recente)
            const qOffers = query(collection(db, "offers"), orderBy("timestamp", "desc"));
            unsubscribeOffers = onSnapshot(qOffers, (snapshot) => {
                offersContainer.innerHTML = '';
                if (snapshot.empty) {
                    offersContainer.innerHTML = '<p class="text-sm text-slate-400 italic">Nessuna offerta presente.</p>';
                    return;
                }
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const isOwner = auth.currentUser && data.userId === auth.currentUser.uid;
                    const card = document.createElement('div');
                    card.className = "p-3 rounded-lg border border-slate-100 bg-slate-50 text-sm flex justify-between items-start gap-2";
                    card.innerHTML = `
                        <div>
                            <p class="text-slate-700 font-medium">${escapeHtml(data.text || '')}</p>
                            <span class="text-[10px] text-slate-400">Utente: ${data.userId ? data.userId.substring(0,6) : 'Anonimo'}...</span>
                        </div>
                        ${isOwner ? '<span class="text-[10px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded font-semibold">Tuo</span>' : ''}
                    `;
                    offersContainer.appendChild(card);
                });
            }, (error) => {
                console.error("Errore listener offerte:", error);
            });

            // Listener Chat (Ordinati per data cronologica)
            const qChat = query(collection(db, "chats"), orderBy("timestamp", "asc"));
            unsubscribeChat = onSnapshot(qChat, (snapshot) => {
                chatContainer.innerHTML = '';
                if (snapshot.empty) {
                    chatContainer.innerHTML = '<p class="text-sm text-slate-400 italic">Nessun messaggio.</p>';
                    return;
                }
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const isOwner = auth.currentUser && data.userId === auth.currentUser.uid;
                    const msg = document.createElement('div');
                    msg.className = `p-2.5 rounded-lg text-sm max-w-[85%] ${
                        isOwner ? 'bg-emerald-600 text-white ml-auto' : 'bg-slate-100 text-slate-700 mr-auto'
                    }`;
                    msg.innerHTML = `
                        <p class="leading-relaxed">${escapeHtml(data.message || '')}</p>
                        <span class="text-[9px] block text-right opacity-70 mt-1">${data.userId ? data.userId.substring(0,5) : 'Anon'}:</span>
                    `;
                    chatContainer.appendChild(msg);
                });
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, (error) => {
                console.error("Errore listener chat:", error);
            });
        }

        function stopListeners() {
            if (unsubscribeOffers) {
                unsubscribeOffers();
                unsubscribeOffers = null;
            }
            if (unsubscribeChat) {
                unsubscribeChat();
                unsubscribeChat = null;
            }
        }

        // STATO AUTENTICAZIONE
        onAuthStateChanged(auth, (user) => {
            if (user) {
                btnLogin.classList.add('hidden');
                btnLogout.classList.remove('hidden');
                userBadge.classList.remove('hidden');
                loggedOutView.classList.add('hidden');
                appSection.classList.remove('hidden');
                
                startListeners();
            } else {
                btnLogin.classList.remove('hidden');
                btnLogout.classList.add('hidden');
                userBadge.classList.add('hidden');
                loggedOutView.classList.remove('hidden');
                appSection.classList.add('hidden');
            }
        });

        // LOGIN / LOGOUT
        btnLogin.addEventListener('click', async () => {
            try {
                await signInAnonymously(auth);
            } catch (error) {
                console.error("Errore di login:", error);
                alert("Errore durante l'accesso. Verifica la console.");
            }
        });

        btnLogout.addEventListener('click', async () => {
            try {
                stopListeners(); // Disattiva i listener PRIMA del logout per prevenire errori di permesso
                await signOut(auth);
            } catch (error) {
                console.error("Errore di logout:", error);
            }
        });

        // AZIONI DB
        btnPublish.addEventListener('click', async () => {
            const text = offerInput.value.trim();
            const user = auth.currentUser;

            if (!user) return alert("Devi essere connesso!");
            if (!text) return;

            try {
                await addDoc(collection(db, "offers"), {
                    text: text,
                    userId: user.uid,
                    timestamp: serverTimestamp()
                });
                offerInput.value = '';
            } catch (error) {
                console.error("Errore pubblicazione:", error);
            }
        });

        btnSendChat.addEventListener('click', async () => {
            const message = chatInput.value.trim();
            const user = auth.currentUser;

            if (!user) return alert("Devi essere connesso!");
            if (!message) return;

            try {
                await addDoc(collection(db, "chats"), {
                    message: message,
                    userId: user.uid,
                    timestamp: serverTimestamp()
                });
                chatInput.value = '';
            } catch (error) {
                console.error("Errore invio messaggio:", error);
            }
        });

        // Utility XSS Prevention
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
