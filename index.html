<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Firebase - Offerte e Chat Sicure</title>
    <style>
        /* Stili di base per un'interfaccia pulita */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #2c3e50; }
        .container {
            width: 100%;
            max-width: 800px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .hidden { display: none !important; }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover { background-color: #2980b9; }
        #btnLogout { background-color: #e74c3c; }
        #btnLogout:hover { background-color: #c0392b; }
        
        .section-title { margin-top: 20px; color: #34495e; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        input[type="text"] {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .data-box {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            padding: 10px;
            height: 150px;
            overflow-y: auto;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .item { padding: 5px 0; border-bottom: 1px dashed #ccc; }
        .item:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header con gestione Login/Logout -->
        <div class="flex-between">
            <h2>Pannello Utente</h2>
            <div>
                <span id="userStatus" style="margin-right: 15px; font-weight: bold; color: #7f8c8d;">Non connesso</span>
                <button id="btnLogin">Accedi (Anonimo)</button>
                <button id="btnLogout" class="hidden">Esci</button>
            </div>
        </div>

        <!-- Sezione principale visibile solo agli utenti loggati -->
        <div id="app-content" class="hidden">
            
            <!-- Sezione Offerte -->
            <h3 class="section-title">Offerte</h3>
            <div class="input-group">
                <input type="text" id="offerInput" placeholder="Scrivi una nuova offerta...">
                <button id="btnPublishOffer">Pubblica Offerta</button>
            </div>
            <div id="offersList" class="data-box">
                <!-- Le offerte appariranno qui -->
                <em>In attesa di offerte...</em>
            </div>

            <!-- Sezione Chat -->
            <h3 class="section-title">Chat Globale</h3>
            <div class="input-group">
                <input type="text" id="chatInput" placeholder="Scrivi un messaggio...">
                <button id="btnSendChat">Invia Messaggio</button>
            </div>
            <div id="chatList" class="data-box">
                <!-- I messaggi appariranno qui -->
                <em>In attesa di messaggi...</em>
            </div>

        </div>
    </div>

    <!-- Modulo Firebase Completo e Definitivo -->
    <script type="module">
        // 1. IMPORTAZIONE SDK FIREBASE
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 2. CONFIGURAZIONE FIREBASE (SOSTITUISCI CON I TUOI DATI)
        const firebaseConfig = {
            apiKey: "INSERISCI_LA_TUA_API_KEY",
            authDomain: "INSERISCI_IL_TUO_AUTH_DOMAIN",
            projectId: "INSERISCI_IL_TUO_PROJECT_ID",
            storageBucket: "INSERISCI_IL_TUO_STORAGE_BUCKET",
            messagingSenderId: "INSERISCI_IL_TUO_MESSAGING_SENDER_ID",
            appId: "INSERISCI_IL_TUO_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 3. VARIABILI PER LA GESTIONE SICURA DEI LISTENER
        let unsubscribeOffers = null;
        let unsubscribeChat = null;

        // Elementi DOM
        const btnLogin = document.getElementById('btnLogin');
        const btnLogout = document.getElementById('btnLogout');
        const userStatus = document.getElementById('userStatus');
        const appContent = document.getElementById('app-content');
        
        const btnPublishOffer = document.getElementById('btnPublishOffer');
        const offerInput = document.getElementById('offerInput');
        const offersList = document.getElementById('offersList');
        
        const btnSendChat = document.getElementById('btnSendChat');
        const chatInput = document.getElementById('chatInput');
        const chatList = document.getElementById('chatList');

        // 4. FUNZIONI PER AVVIARE E FERMARE I LISTENER
        function startListeners() {
            // Listener Offerte (Ordinate per data)
            const qOffers = query(collection(db, "offers"), orderBy("timestamp", "desc"));
            unsubscribeOffers = onSnapshot(qOffers, (snapshot) => {
                offersList.innerHTML = '';
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    offersList.innerHTML += `<div class="item"><strong>User:</strong> ${data.text}</div>`;
                });
            }, (error) => {
                console.error("Errore lettura offerte:", error);
            });

            // Listener Chat (Ordinate per data)
            const qChat = query(collection(db, "chats"), orderBy("timestamp", "asc"));
            unsubscribeChat = onSnapshot(qChat, (snapshot) => {
                chatList.innerHTML = '';
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    chatList.innerHTML += `<div class="item"><strong>User:</strong> ${data.message}</div>`;
                });
                chatList.scrollTop = chatList.scrollHeight; // Auto-scroll verso il basso
            }, (error) => {
                console.error("Errore lettura chat:", error);
            });
        }

        function stopListeners() {
            // FONDAMENTALE: Previene l'errore "Missing or insufficient permissions"
            if (unsubscribeOffers) {
                unsubscribeOffers();
                unsubscribeOffers = null;
            }
            if (unsubscribeChat) {
                unsubscribeChat();
                unsubscribeChat = null;
            }
        }

        // 5. OSSERVATORE STATO AUTENTICAZIONE
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // UI Utente Loggato
                btnLogin.classList.add('hidden');
                btnLogout.classList.remove('hidden');
                appContent.classList.remove('hidden');
                userStatus.textContent = `Connesso: ${user.uid.substring(0, 6)}...`;
                userStatus.style.color = "#27ae60";
                
                startListeners(); // Avvia i listener in sicurezza
            } else {
                // UI Utente Disconnesso
                btnLogin.classList.remove('hidden');
                btnLogout.classList.add('hidden');
                appContent.classList.add('hidden');
                userStatus.textContent = "Non connesso";
                userStatus.style.color = "#7f8c8d";
            }
        });

        // 6. GESTIONE LOGIN E LOGOUT
        btnLogin.addEventListener('click', async () => {
            try {
                await signInAnonymously(auth);
            } catch (error) {
                console.error("Errore di login:", error);
                alert("Errore di connessione. Controlla la console.");
            }
        });

        btnLogout.addEventListener('click', async () => {
            try {
                stopListeners(); // FERMA I LISTENER PRIMA DEL LOGOUT
                await signOut(auth);
            } catch (error) {
                console.error("Errore durante il logout:", error);
            }
        });

        // 7. GESTIONE PUBBLICAZIONE (CON CONTROLLI DI SICUREZZA)
        btnPublishOffer.addEventListener('click', async () => {
            const text = offerInput.value.trim();
            const user = auth.currentUser;

            if (!user) {
                alert("Errore di sicurezza: Devi essere autenticato per pubblicare.");
                return;
            }
            if (!text) return;

            try {
                // L'UID viene inviato per rispettare le regole di sicurezza Firestore
                await addDoc(collection(db, "offers"), {
                    text: text,
                    userId: user.uid,
                    timestamp: serverTimestamp()
                });
                offerInput.value = '';
            } catch (error) {
                console.error("Errore pubblicazione offerta:", error);
                alert("Impossibile pubblicare l'offerta. Controlla i permessi.");
            }
        });

        btnSendChat.addEventListener('click', async () => {
            const message = chatInput.value.trim();
            const user = auth.currentUser;

            if (!user) {
                alert("Errore di sicurezza: Devi essere autenticato per inviare messaggi.");
                return;
            }
            if (!message) return;

            try {
                await addDoc(collection(db, "chats"), {
                    message: message,
                    userId: user.uid,
                    timestamp: serverTimestamp()
                });
                chatInput.value = '';
            } catch (error) {
                console.error("Errore invio messaggio:", error);
                alert("Impossibile inviare il messaggio. Controlla i permessi.");
            }
        });

    </script>
</body>
</html>
